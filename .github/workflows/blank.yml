name: Generate Datas

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Generate Snake
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: IvanilsoDaSilva
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF00FF&color_dots=%23161B22,%23660066,%23B000B5,%23FF00FF,%23FFFFFF
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF00FF&color_dots=%23161B22,%23660066,%23B000B5,%23FF00FF,%23FFFFFF

      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
